name: duck-monitoring-lab

services:
  # Web Server 1
  web-server-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-web-1
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=web-server-1
      - AGENT_ID=web-server-1-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  # Web Server 2
  web-server-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-web-2
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=web-server-2
      - AGENT_ID=web-server-2-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  # Database Server
  db-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-db
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=db-server
      - AGENT_ID=db-server-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  # Cache Server
  cache-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-cache
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=cache-server
      - AGENT_ID=cache-server-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  # App Server 1
  app-server-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-app-1
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=app-server-1
      - AGENT_ID=app-server-1-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

  # App Server 2
  app-server-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    container_name: duck-lab-app-2
    environment:
      - SERVER_URL=http://host.docker.internal:8000
      - HOSTNAME=app-server-2
      - AGENT_ID=app-server-2-agent
      - INTERVAL=30
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge
