<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111411" />
    <meta name="description" content="Duck Monitoring - Network Monitoring System" />
    <title>Duck Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var vendor = navigator.vendor || '';
        var ios = /iP(hone|od|ad)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var safari = /Safari/i.test(ua) && /Apple Computer/i.test(vendor)
          && !/Chrom(e|ium)|CriOS|Edg|OPR|Brave|Firefox|FxiOS|Android/i.test(ua);
        var root = document.documentElement;
        var theme = 'light';
        try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
        root.setAttribute('data-theme', theme);
        root.dataset.browser = safari ? 'safari'
          : /Firefox|FxiOS/i.test(ua) ? 'firefox'
          : /Edg\//.test(ua) ? 'edge'
          : /Chrom(e|ium)|CriOS|OPR|Brave/i.test(ua) ? 'chrome'
          : 'other';
        root.dataset.os = ios ? 'ios'
          : /Mac/.test(navigator.platform || ua) ? 'macos'
          : /Win/.test(navigator.platform || ua) ? 'windows'
          : /Android/i.test(ua) ? 'android'
          : /Linux/.test(ua) ? 'linux'
          : 'other';
        if (ios || /Android|Mobile/i.test(ua)) root.dataset.mobile = 'true';
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
